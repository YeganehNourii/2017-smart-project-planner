[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-project-planner"
version = "1.0.0"
description = "Team project planner: binary-heap next-task queue, topological sort, critical path method, SQLite storage."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Yeganeh Nouri" }]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
planner = "planner.cli:main"

[tool.setuptools]
packages = ["planner"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
