name: Tests

on:
  push:
  pull_request:

jobs:
  pytest:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest -v
      - name: Try the CLI on the sample project
        run: |
          planner --db sample.db import samples/campus-app.json
          planner --db sample.db show "Campus study-room app"
          planner --db sample.db next "Campus study-room app"
